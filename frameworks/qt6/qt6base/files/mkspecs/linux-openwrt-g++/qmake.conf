#
# qmake configuration for building with linux-openwrt-g++
#

MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

QMAKE_CFLAGS_OPTIMIZE      =
QMAKE_CFLAGS_OPTIMIZE_FULL =
# $QMAKE_C*FLAGS_RELEASE set optimization flags directly instead of referencing
# $QMAKE_CFLAGS_OPTIMIZE*, so clear them explicitly, too
QMAKE_CFLAGS_RELEASE   =
QMAKE_CXXFLAGS_RELEASE = $$QMAKE_CFLAGS_RELEASE

# modifications to gcc-base.conf (included by gcc-base-unix.conf)
QMAKE_CFLAGS           += $$(TARGET_CFLAGS)
QMAKE_CXXFLAGS         += $$(TARGET_CXXFLAGS)
QMAKE_LFLAGS           += $$(TARGET_LDFLAGS)

# modifications to g++.conf
QMAKE_CC                = $$(TARGET_CROSS)gcc
QMAKE_CXX               = $$(TARGET_CROSS)g++

QMAKE_LINK_C            = $$QMAKE_CC
QMAKE_LINK_C_SHLIB      = $$QMAKE_CC
QMAKE_LINK              = $$QMAKE_CXX
QMAKE_LINK_SHLIB        = $$QMAKE_CXX


# modifications to linux.conf
QMAKE_AR                = $$(TARGET_CROSS)ar cqs
QMAKE_RANLIB            = $$(TARGET_CROSS)ranlib # empty in linux.conf (QMAKE_AR indexes the archive), set to the target's ranlib anyway
QMAKE_OBJCOPY           = $$(TARGET_CROSS)objcopy
QMAKE_NM                = $$(TARGET_CROSS)nm # only used by Qt for LTCG builds, set to the target's nm instead of the host's anyway
QMAKE_STRIP             = # empty, so qmake's install step does not strip; OpenWrt strips when packaging


load(qt_config)
