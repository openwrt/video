#
# qmake configuration for building with linux-openwrt-host-g++
#

MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

# optimization flags are part of $HOST_CFLAGS
QMAKE_CFLAGS_OPTIMIZE      =
QMAKE_CFLAGS_OPTIMIZE_FULL =
QMAKE_CFLAGS_RELEASE   =
QMAKE_CXXFLAGS_RELEASE = $$QMAKE_CFLAGS_RELEASE

# modifications to gcc-base.conf (included by gcc-base-unix.conf)
QMAKE_CFLAGS           += $$(HOST_CFLAGS)
QMAKE_CXXFLAGS         += $$(HOST_CXXFLAGS)
QMAKE_LFLAGS           += $$(HOST_LDFLAGS)

# modifications to g++.conf
QMAKE_CC                = $$(HOSTCC)
QMAKE_CXX               = $$(HOSTCXX)

QMAKE_LINK_C            = $$QMAKE_CC
QMAKE_LINK_C_SHLIB      = $$QMAKE_CC
QMAKE_LINK              = $$QMAKE_CXX
QMAKE_LINK_SHLIB        = $$QMAKE_CXX

load(qt_config)
